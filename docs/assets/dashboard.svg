<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
	<title id="title">last30days-news reader</title>
	<desc id="desc">A desktop-style reader with categories on the left, a feed in the middle, and a selected story with an AI summary on the right.</desc>
	<style>
		text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
		.mono { font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; }
		.muted { fill: #848484; }
		.dim { fill: #545454; }
		.ink { fill: #141414; }
		.line { stroke: #e3e3e3; }
		.line-2 { stroke: #d2d2d2; }
		.accent { fill: #0f6cbd; }
		.accent-stroke { stroke: #0f6cbd; }
		@keyframes rowFocus {
			0%, 28% { transform: translateY(0); }
			33%, 61% { transform: translateY(66px); }
			66%, 94% { transform: translateY(132px); }
			100% { transform: translateY(0); }
		}
		.row-focus { animation: rowFocus 9s ease-in-out infinite; }
		@keyframes spin {
			0%, 8% { transform: rotate(0deg); }
			18%, 100% { transform: rotate(360deg); }
		}
		.spin { transform-origin: 1046px 32px; animation: spin 7s linear infinite; }
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.35; }
		}
		.pulse { animation: pulse 2.4s ease-in-out infinite; }
		@keyframes caret {
			0%, 45% { opacity: 1; }
			50%, 100% { opacity: 0; }
		}
		.caret { animation: caret 1.1s steps(1) infinite; }
		@media (prefers-reduced-motion: reduce) {
			.row-focus, .spin, .pulse, .caret { animation: none; }
		}
	</style>

	<rect width="1200" height="660" fill="#f3f3f3"/>
	<rect x="0.5" y="0.5" width="1199" height="659" rx="16" fill="none" stroke="#d2d2d2"/>

	<!-- Top bar -->
	<rect x="24" y="16" width="28" height="28" rx="8" fill="#0f6cbd"/>
	<text x="38" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">30</text>
	<text x="62" y="36" font-size="14" font-weight="600" class="ink">last30days-news</text>

	<rect x="210" y="12" width="330" height="36" rx="9" fill="#ffffff" stroke="#d2d2d2"/>
	<circle cx="230" cy="30" r="6" fill="none" stroke="#848484" stroke-width="1.6"/>
	<path d="M235 35l5 5" fill="none" stroke="#848484" stroke-width="1.6" stroke-linecap="round"/>
	<text x="248" y="34" font-size="12.5" class="muted">Search items</text>
	<rect x="246" y="24" width="1.5" height="13" rx="0.75" class="accent caret"/>
	<rect x="486" y="20" width="44" height="20" rx="5" fill="#f2f2f2" stroke="#e3e3e3"/>
	<text x="508" y="34" text-anchor="middle" font-size="9.5" class="muted mono">Ctrl K</text>

	<rect x="560" y="12" width="150" height="36" rx="9" fill="#e9e9e9"/>
	<rect x="563" y="15" width="46" height="30" rx="7" fill="#ffffff" stroke="#e3e3e3"/>
	<text x="586" y="35" text-anchor="middle" font-size="11.5" class="ink">24h</text>
	<text x="634" y="35" text-anchor="middle" font-size="11.5" class="dim">7d</text>
	<text x="682" y="35" text-anchor="middle" font-size="11.5" class="dim">30d</text>

	<g fill="none" stroke="#545454" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
		<g class="spin">
			<path d="M1041 27a8 8 0 1 0 2.3 5.7"/>
			<path d="M1046 23v7h-7"/>
		</g>
		<circle cx="1078" cy="32" r="8"/>
		<path d="M1075.8 29a2.4 2.4 0 1 1 3.7 2c-.9.6-1.5 1-1.5 2"/>
		<path d="M1078 37h.01"/>
		<circle cx="1110" cy="32" r="4"/>
		<path d="M1110 22v2M1110 40v2M1100 32h2M1118 32h2M1103 25l1.4 1.4M1115.6 37.6l1.4 1.4M1103 39l1.4-1.4M1115.6 26.4l1.4-1.4"/>
		<path d="M1150 27l5 5-5 5M1155 32h-10M1152 23h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
	</g>

	<!-- Sidebar -->
	<rect x="16" y="62" width="220" height="540" rx="12" fill="#e9e9e9"/>
	<text x="32" y="94" font-size="10.5" font-weight="600" letter-spacing="1.4" class="muted mono">CATEGORIES</text>
	<circle cx="214" cy="90" r="11" fill="none" stroke="#848484" stroke-width="1.5"/>
	<path d="M214 84v12M208 90h12" fill="none" stroke="#848484" stroke-width="1.5" stroke-linecap="round"/>

	<rect x="26" y="110" width="200" height="38" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
	<text x="40" y="134" font-size="13.5" class="ink">All items</text>
	<text x="212" y="134" text-anchor="end" font-size="11.5" class="dim mono">128</text>
	<text x="40" y="178" font-size="13.5" class="dim">AI &amp; research</text>
	<text x="212" y="178" text-anchor="end" font-size="11.5" class="muted mono">42</text>
	<text x="40" y="222" font-size="13.5" class="dim">Engineering</text>
	<text x="212" y="222" text-anchor="end" font-size="11.5" class="muted mono">31</text>
	<text x="40" y="266" font-size="13.5" class="dim">Security</text>
	<text x="212" y="266" text-anchor="end" font-size="11.5" class="muted mono">18</text>
	<text x="40" y="310" font-size="13.5" class="dim">Product</text>
	<text x="212" y="310" text-anchor="end" font-size="11.5" class="muted mono">14</text>
	<text x="40" y="354" font-size="13.5" class="dim">Science</text>
	<text x="212" y="354" text-anchor="end" font-size="11.5" class="muted mono">9</text>

	<path d="M16 548h220" class="line"/>
	<path d="M36 574v12M30 580h12" fill="none" stroke="#545454" stroke-width="1.6" stroke-linecap="round"/>
	<text x="50" y="583" font-size="13" class="dim">Manage categories</text>

	<!-- Feed -->
	<rect x="246" y="62" width="530" height="540" rx="12" fill="#f7f7f7"/>
	<text x="262" y="94" font-size="10.5" font-weight="600" letter-spacing="1.4" class="muted mono">LATEST</text>
	<text x="760" y="94" text-anchor="end" font-size="11.5" class="muted mono">24 HOURS</text>

	<!-- Moving focus block: row 1, then row 2, then row 3 -->
	<g class="row-focus">
		<rect x="256" y="110" width="510" height="62" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
		<rect x="256" y="120" width="3" height="42" rx="1.5" class="accent"/>
	</g>

	<!-- Row 1 -->
	<rect x="270" y="124" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="139" text-anchor="middle" font-size="9.5" class="muted mono">HF</text>
	<text x="302" y="136" font-size="13.5" font-weight="500" class="ink">RoboTrack: point tracking for real-world robots</text>
	<text x="302" y="154" font-size="11.5" class="muted">Hugging Face Blog</text>
	<text x="752" y="136" text-anchor="end" font-size="11" class="muted mono">34m</text>

	<!-- Row 2 -->
	<rect x="270" y="190" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="205" text-anchor="middle" font-size="9.5" class="muted mono">HN</text>
	<text x="302" y="202" font-size="13.5" font-weight="500" class="ink">Kagi Mail is here (Public Beta)</text>
	<text x="302" y="220" font-size="11.5" class="muted">Hacker News</text>
	<text x="752" y="202" text-anchor="end" font-size="11" class="muted mono">38m</text>

	<!-- Row 3 -->
	<rect x="270" y="256" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="271" text-anchor="middle" font-size="9.5" class="muted mono">TA</text>
	<text x="302" y="268" font-size="13.5" font-weight="500" class="ink">Amazon snaps up Decart's AI optimization tech</text>
	<text x="302" y="286" font-size="11.5" class="muted">TechCrunch AI</text>
	<text x="752" y="268" text-anchor="end" font-size="11" class="muted mono">41m</text>

	<!-- Row 4 -->
	<rect x="270" y="322" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="337" text-anchor="middle" font-size="9.5" class="muted mono">HN</text>
	<text x="302" y="334" font-size="13.5" class="ink">Nginx 1.30.8 fixes a TLS early-data CVE</text>
	<text x="302" y="352" font-size="11.5" class="muted">Hacker News</text>
	<text x="752" y="334" text-anchor="end" font-size="11" class="muted mono">1h</text>

	<!-- Row 5 -->
	<rect x="270" y="388" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="403" text-anchor="middle" font-size="9.5" class="muted mono">AT</text>
	<text x="302" y="400" font-size="13.5" class="ink">Marvel crams every hero into the Doomsday trailer</text>
	<text x="302" y="418" font-size="11.5" class="muted">Ars Technica</text>
	<text x="752" y="400" text-anchor="end" font-size="11" class="muted mono">2h</text>

	<!-- Row 6 -->
	<rect x="270" y="454" width="22" height="22" rx="6" fill="#ffffff" stroke="#d2d2d2"/>
	<text x="281" y="469" text-anchor="middle" font-size="9.5" class="muted mono">V</text>
	<text x="302" y="466" font-size="13.5" class="ink">The best Black Friday deals we've found so far</text>
	<text x="302" y="484" font-size="11.5" class="muted">The Verge</text>
	<text x="752" y="466" text-anchor="end" font-size="11" class="muted mono">2h</text>

	<!-- Detail -->
	<rect x="786" y="62" width="398" height="540" rx="12" fill="#f7f7f7"/>
	<text x="802" y="94" font-size="10.5" font-weight="600" letter-spacing="1.4" class="muted mono">DETAIL</text>

	<text x="802" y="128" font-size="18" font-weight="600" class="ink">RoboTrack: point tracking for</text>
	<text x="802" y="151" font-size="18" font-weight="600" class="ink">real-world robotic manipulation</text>

	<text x="802" y="176" font-size="11.5" class="muted mono">34m ago</text>
	<text x="850" y="176" font-size="11.5" class="dim">Hugging Face</text>
	<rect x="936" y="163" width="76" height="18" rx="9" fill="#e9e9e9"/>
	<text x="974" y="176" text-anchor="middle" font-size="10" class="dim">AI &amp; research</text>

	<rect x="802" y="192" width="106" height="30" rx="7" fill="#f2f2f2" stroke="#e3e3e3"/>
	<text x="855" y="212" text-anchor="middle" font-size="12" class="ink">Open original</text>
	<text x="920" y="212" font-size="11" class="muted">via Hugging Face Blog</text>

	<path d="M802 242h366" class="line"/>

	<text x="802" y="266" font-size="10" font-weight="600" letter-spacing="1.3" class="muted mono">SUMMARY</text>
	<text x="802" y="288" font-size="12.5" class="dim">RoboTrack follows points through video</text>
	<text x="802" y="305" font-size="12.5" class="dim">without per-frame labels, so a robot arm</text>
	<text x="802" y="322" font-size="12.5" class="dim">can track objects it has never seen.</text>
	<text x="802" y="343" font-size="12.5" class="dim">Weights and code are public, including a</text>
	<text x="802" y="360" font-size="12.5" class="dim">stacking demo you can run on one GPU.</text>

	<text x="802" y="390" font-size="10" font-weight="600" letter-spacing="1.3" class="muted mono">KEY POINTS</text>
	<circle cx="806" cy="408" r="2" class="accent"/>
	<text x="816" y="412" font-size="12" class="dim">No supervised point annotations needed.</text>
	<circle cx="806" cy="428" r="2" class="accent"/>
	<text x="816" y="432" font-size="12" class="dim">Weights and a stacking demo are included.</text>

	<text x="802" y="462" font-size="10" font-weight="600" letter-spacing="1.3" class="muted mono">WHY IT MATTERS</text>
	<text x="802" y="484" font-size="12" class="dim">Point tracking is the missing piece for robots</text>
	<text x="802" y="501" font-size="12" class="dim">that must handle new objects without retraining.</text>

	<text x="802" y="530" font-size="11.5" class="accent">[1] Hugging Face Blog   [2] arXiv</text>
	<text x="802" y="552" font-size="10.5" class="muted mono">Generated 2 min ago</text>

	<!-- Status bar -->
	<circle cx="26" cy="628" r="7" fill="none" stroke="#0f6cbd" stroke-width="1.5" class="pulse"/>
	<path d="M23 628l2 2 4-4" fill="none" stroke="#0f6cbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
	<text x="40" y="632" font-size="11.5" class="muted">Ready</text>
	<text x="1178" y="632" text-anchor="end" font-size="11" class="muted mono">128 items  ·  24h</text>
</svg>
