<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
	<title id="title">Local and deployed password rules</title>
	<desc id="desc">A local install accepts the default password last30 on first run and allows reset from the same machine. A deployment requires L30_INITIAL_PASSWORD, rejects last30, and disables reset.</desc>
	<style>
		text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
		.mono { font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; }
		.ink { fill: #141414; }
		.dim { fill: #545454; }
		.muted { fill: #848484; }
		.lane { fill: #f7f7f7; stroke: #e3e3e3; }
		.box { fill: #ffffff; stroke: #e3e3e3; }
		.flow { fill: none; stroke: #0f6cbd; stroke-width: 1.8; stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; }
		.flow-dim { fill: none; stroke: #848484; stroke-width: 1.8; stroke-dasharray: 6 6; animation: dash 1.9s linear infinite; }
		@keyframes dash { to { stroke-dashoffset: -24; } }
		@keyframes pulse {
			0%, 100% { opacity: 0.35; }
			50% { opacity: 1; }
		}
		.pulse { animation: pulse 2.6s ease-in-out infinite; }
		@media (prefers-reduced-motion: reduce) {
			.flow, .flow-dim, .pulse { animation: none; }
		}
	</style>

	<rect width="1200" height="420" fill="#f3f3f3"/>
	<rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#d2d2d2"/>

	<!-- Local lane -->
	<rect x="24" y="28" width="1152" height="164" rx="14" class="lane"/>
	<rect x="24" y="28" width="4" height="164" rx="2" fill="#0f6cbd"/>
	<text x="48" y="58" font-size="15" font-weight="600" class="ink">Local install</text>
	<text x="48" y="78" font-size="11.5" class="muted">You are at the keyboard. The local escape hatch stays available.</text>

	<rect x="48" y="98" width="250" height="58" rx="9" class="box"/>
	<text x="64" y="120" font-size="12.5" font-weight="500" class="ink">Login page</text>
	<text x="64" y="138" font-size="10.5" class="muted">first run</text>

	<path d="M302 127h18" class="flow"/>
	<path d="M318 123l5 4-5 4" fill="none" stroke="#0f6cbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<rect x="326" y="98" width="250" height="58" rx="9" class="box"/>
	<text x="342" y="120" font-size="12.5" font-weight="500" class="ink">Default password</text>
	<text x="342" y="138" font-size="10.5" class="muted mono">last30</text>

	<path d="M580 127h18" class="flow"/>
	<path d="M596 123l5 4-5 4" fill="none" stroke="#0f6cbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<rect x="604" y="98" width="250" height="58" rx="9" class="box"/>
	<text x="620" y="120" font-size="12.5" font-weight="500" class="ink">Settings</text>
	<text x="620" y="138" font-size="10.5" class="muted">change the password</text>

	<path d="M858 127h18" class="flow"/>
	<path d="M874 123l5 4-5 4" fill="none" stroke="#0f6cbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<rect x="882" y="98" width="250" height="58" rx="9" class="box"/>
	<text x="898" y="120" font-size="12.5" font-weight="500" class="ink">Reset</text>
	<text x="898" y="138" font-size="10.5" class="muted mono">/reset from this machine</text>

	<text x="48" y="178" font-size="11" class="dim">Reset clears the password, API keys and sessions. Items, sources and categories stay.</text>

	<!-- Deployment lane -->
	<rect x="24" y="220" width="1152" height="164" rx="14" class="lane"/>
	<rect x="24" y="220" width="4" height="164" rx="2" fill="#545454"/>
	<text x="48" y="250" font-size="15" font-weight="600" class="ink">Deployment</text>
	<text x="48" y="270" font-size="11.5" class="muted">Docker, VPS or Vercel. The app is reachable by other people.</text>

	<rect x="48" y="290" width="250" height="58" rx="9" class="box"/>
	<text x="64" y="312" font-size="12.5" font-weight="500" class="ink">Login page</text>
	<text x="64" y="330" font-size="10.5" class="muted">public URL</text>

	<path d="M302 319h18" class="flow-dim"/>
	<path d="M318 315l5 4-5 4" fill="none" stroke="#848484" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<rect x="326" y="290" width="250" height="58" rx="9" class="box"/>
	<text x="342" y="312" font-size="12.5" font-weight="500" class="ink">First password</text>
	<text x="342" y="330" font-size="10.5" class="muted mono">L30_INITIAL_PASSWORD</text>

	<path d="M580 319h18" class="flow-dim"/>
	<path d="M596 315l5 4-5 4" fill="none" stroke="#848484" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

	<rect x="604" y="290" width="250" height="58" rx="9" class="box"/>
	<text x="620" y="312" font-size="12.5" font-weight="500" class="ink">Default password</text>
	<text x="620" y="330" font-size="10.5" class="muted mono">last30</text>
	<text x="620" y="344" font-size="10" font-weight="600" fill="#b42318">rejected</text>

	<circle cx="836" cy="319" r="11" fill="#ffffff" stroke="#b42318" stroke-width="1.6"/>
	<path d="M832 315l8 8M840 315l-8 8" fill="none" stroke="#b42318" stroke-width="1.7" stroke-linecap="round"/>

	<rect x="882" y="290" width="250" height="58" rx="9" class="box"/>
	<text x="898" y="312" font-size="12.5" font-weight="500" class="ink">Reset</text>
	<text x="898" y="330" font-size="10.5" class="muted mono">403 reset_local_only</text>

	<circle cx="48" cy="370" r="3" fill="#545454" class="pulse"/>
	<text x="60" y="374" font-size="11" class="dim">last30 is rejected even if the database has its hash. No stored password and no L30_INITIAL_PASSWORD fails closed with 503 setup_required.</text>
</svg>
