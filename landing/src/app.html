<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=light" />
		%sveltekit.head%
		<script>
			// Runs before paint so the saved theme applies without a flash. The home
			// page still ships no client JS; docs pages hydrate separately.
			try {
				const saved = localStorage.getItem('l30-theme');
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.classList.add(saved);
				}
			} catch {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// The home page ships no JS; docs hydrate. The theme toggle is delegated
			// so it keeps working after a client-side navigation replaces the button.
			const root = document.documentElement;
			const current = () =>
				root.classList.contains('light')
					? 'light'
					: root.classList.contains('dark')
						? 'dark'
						: matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';

			document.addEventListener('click', (event) => {
				if (!event.target.closest('#theme-toggle')) return;
				const next = current() === 'dark' ? 'light' : 'dark';
				root.classList.remove('dark', 'light');
				root.classList.add(next);
				try {
					localStorage.setItem('l30-theme', next);
				} catch {}
			});

			// In-page sections without a hash in the URL; no hydration to do it for us.
			for (const link of document.querySelectorAll('[data-scroll]')) {
				link.addEventListener('click', () => {
					link.closest('details')?.removeAttribute('open');
					const target = document.getElementById(link.dataset.scroll || '');
					if (!target) return;
					target.scrollIntoView({
						behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
						block: 'start'
					});
				});
			}

			// The sections menu is a native <details>; close it like a flyout.
			const menu = document.querySelector('details.menu');
			document.addEventListener('click', (event) => {
				if (menu?.open && !menu.contains(event.target)) menu.removeAttribute('open');
			});
			document.addEventListener('keydown', (event) => {
				if (event.key === 'Escape') menu?.removeAttribute('open');
			});

			const copyText = async (text) => {
				try {
					await navigator.clipboard.writeText(text);
					return true;
				} catch {
					// Older browsers and plain-http hosts: select and copy by hand.
					const field = document.createElement('textarea');
					field.value = text;
					field.setAttribute('readonly', '');
					field.style.position = 'fixed';
					field.style.opacity = '0';
					document.body.append(field);
					field.select();
					let copied = false;
					try {
						copied = document.execCommand('copy');
					} catch {}
					field.remove();
					return copied;
				}
			};

			// Install command: platform tabs and the copy button.
			const cmd = document.getElementById('install-cmd');
			const copy = document.getElementById('copy-install');
			const status = document.getElementById('copy-status');
			const tabs = Array.from(document.querySelectorAll('.tab[data-cmd]'));

			const reset = () => {
				copy?.classList.remove('done');
				copy?.setAttribute('aria-label', 'Copy install command');
				if (status) status.textContent = '';
			};

			for (const tab of tabs) {
				tab.addEventListener('click', () => {
					for (const other of tabs) {
						other.setAttribute('aria-pressed', String(other === tab));
					}
					const command = tab.dataset.cmd || '';
					if (cmd) cmd.textContent = command;
					if (copy) copy.dataset.copy = command;
					reset();
				});
			}

			copy?.addEventListener('click', async () => {
				const command = copy.dataset.copy || '';
				const done = () => {
					copy.classList.add('done');
					copy.setAttribute('aria-label', 'Install command copied');
					if (status) status.textContent = 'Install command copied';
					setTimeout(() => {
						copy.classList.remove('done');
						copy.setAttribute('aria-label', 'Copy install command');
						if (status) status.textContent = '';
					}, 1600);
				};

				if (await copyText(command)) done();
			});
		</script>
	</body>
</html>
