name: Dependabot merge

# The Dependabot pull request token is read-only, and repository auto-merge may
# be off, so this runs after CI in the base context. It only touches a PR that
# the policy labelled and that still points at the commit CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pulls=$(gh api "repos/$REPO/commits/$SHA/pulls")
          number=$(jq -r '[.[] | select(.state == "open")][0].number // empty' <<< "$pulls")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge or close
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN: ${{ github.event.workflow_run.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr view "$NUMBER" --repo "$REPO" --json author,baseRefName,headRefOid,labels)
          author=$(jq -r '.author.login' <<< "$pr")
          base=$(jq -r '.baseRefName' <<< "$pr")
          head=$(jq -r '.headRefOid' <<< "$pr")
          labels=$(jq -r '.labels[].name' <<< "$pr")
          if [ "$author" != 'dependabot[bot]' ] || [ "$base" != "$DEFAULT_BRANCH" ]; then
            exit 0
          fi
          if [ "$head" != "$SHA" ] || ! grep -qx automerge <<< "$labels"; then
            exit 0
          fi
          case "$CONCLUSION" in
            success)
              gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch
              ;;
            failure|timed_out)
              gh pr comment "$NUMBER" --repo "$REPO" --body "CI failed, so the dependency policy closed this update. Reopen it if the failure is unrelated to the bump: $RUN"
              gh pr close "$NUMBER" --repo "$REPO" --delete-branch
              ;;
          esac
