version: 2

# The root entry covers landing/ as well: pnpm resolves both manifests through
# one lockfile at the repository root.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
